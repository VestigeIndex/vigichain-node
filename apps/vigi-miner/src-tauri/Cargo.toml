[package]
name = "vigi-miner"
version = "0.1.0"
description = "VigiChain desktop miner and node controller"
authors = ["VigiChain"]
edition = "2021"

[lib]
name = "vigi_miner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
